name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
      - run: pnpm test
      - run: pnpm build
      - name: Verify CLI starts
        run: node dist/cli.js --help
      - name: Publish with provenance
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME}"
          export V="${tag#v}"
          awk '/^## /{f=(index($0,"## ["ENVIRON["V"]"]")==1||index($0,"## "ENVIRON["V"]" ")==1);next} f' CHANGELOG.md | grep -v '^\[' > notes.md
          if [ -s notes.md ]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --notes-file notes.md
            else
              gh release create "$tag" --title "$tag" --notes-file notes.md
            fi
          else
            echo "no CHANGELOG section for $V, falling back to generated notes"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
